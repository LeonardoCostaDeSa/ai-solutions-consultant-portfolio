name: VPS Repair

on:
  workflow_dispatch:

jobs:
  docker-min-api:
    runs-on: ubuntu-latest

    steps:
      - name: Repair Docker API compatibility on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 2200 }}
          script: |
            set -eu

            echo "==> Current Docker version"
            docker version || true

            echo "==> Current Traefik logs"
            docker ps --filter 'name=^/traefik$' --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Networks}}'
            docker logs --tail 80 traefik || true

            echo "==> Patch Docker daemon minimum API version"
            BACKUP="/etc/docker/daemon.json.bak-vps-repair-$(date -u +%Y%m%dT%H%M%SZ)"
            export BACKUP
            python3 - <<'PY'
            import json
            import os
            import pathlib
            import shutil

            path = pathlib.Path("/etc/docker/daemon.json")
            backup = pathlib.Path(os.environ["BACKUP"])

            if path.exists():
                shutil.copy2(path, backup)
                raw = path.read_text().strip()
                data = json.loads(raw) if raw else {}
            else:
                backup.write_text("{}\n")
                data = {}

            if not isinstance(data, dict):
                raise SystemExit("/etc/docker/daemon.json must contain a JSON object")

            before = data.get("min-api-version")
            data["min-api-version"] = "1.24"
            path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
            print(f"backup={backup}")
            print(f"min-api-version: {before!r} -> {data['min-api-version']!r}")
            PY

            python3 -m json.tool /etc/docker/daemon.json >/dev/null
            cat /etc/docker/daemon.json

            echo "==> Restart Docker daemon"
            if ! systemctl restart docker; then
              echo "Docker restart failed. Attempting rollback."
              cp -a "$BACKUP" /etc/docker/daemon.json
              systemctl restart docker || true
              journalctl -u docker --no-pager -n 120 || true
              exit 1
            fi

            sleep 6
            docker version

            echo "==> Restart Traefik after daemon compatibility patch"
            docker restart traefik
            sleep 10
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Networks}}'
            docker logs --tail 120 traefik

            echo "==> Smoke test via local Traefik"
            curl --silent --show-error --fail --insecure --max-time 20 --resolve leonardosa.pro:443:127.0.0.1 https://leonardosa.pro/ >/dev/null
            curl --silent --show-error --fail --insecure --max-time 20 --resolve www.leonardosa.pro:443:127.0.0.1 https://www.leonardosa.pro/ >/dev/null
            curl --silent --show-error --fail --insecure --max-time 20 --resolve express.revisamaster.com:443:127.0.0.1 https://express.revisamaster.com/api/health >/dev/null
