name: Build and Deploy

on:
  push:
    branches:
      - master
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_UMAMI_WEBSITE_ID=${{ vars.UMAMI_WEBSITE_ID }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.yml"
          target: "~/portfolio"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            cd ~/portfolio

            echo "==> Preflight"
            docker network inspect traefik-public >/dev/null
            docker compose config --quiet
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Networks}}'

            echo "==> Login to GHCR"
            echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true

            echo "==> Pull and restart portfolio"
            docker compose pull
            docker compose up -d --force-recreate

            echo "==> Reload Traefik routers"
            TRAEFIK_CONTAINER="$(docker ps --filter 'name=^/traefik$' --format '{{.Names}}' | head -n 1)"
            if [ -n "$TRAEFIK_CONTAINER" ]; then
              docker restart "$TRAEFIK_CONTAINER"
              sleep 8
            else
              echo "WARNING: traefik container not found by exact name"
            fi

            echo "==> Post-restart Docker state"
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Networks}}'
            docker inspect portfolio --format 'portfolio labels={{json .Config.Labels}} networks={{json .NetworkSettings.Networks}}'
            if [ -n "$TRAEFIK_CONTAINER" ]; then
              docker logs --tail 120 "$TRAEFIK_CONTAINER"
            fi

            echo "==> Smoke test via local Traefik"
            curl --silent --show-error --fail --insecure --max-time 20 --resolve leonardosa.pro:443:127.0.0.1 https://leonardosa.pro/ >/dev/null
            curl --silent --show-error --fail --insecure --max-time 20 --resolve www.leonardosa.pro:443:127.0.0.1 https://www.leonardosa.pro/ >/dev/null
            curl --silent --show-error --fail --insecure --max-time 20 --resolve express.revisamaster.com:443:127.0.0.1 https://express.revisamaster.com/api/health >/dev/null || true

            docker image prune -f
