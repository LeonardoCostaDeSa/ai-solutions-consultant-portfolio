server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik (TLS terminated upstream): never emit host/port in redirects,
    # which would otherwise downgrade to http://host:80.
    absolute_redirect off;
    port_in_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript image/svg+xml;

    # Pre-rendered HTML must always revalidate (deploys replace it)
    # NOTE: add_header in a location suppresses server-level add_header — repeat security headers here.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Cache static assets (hashed filenames in /assets, plus images/fonts)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Pre-rendered pages: serve /solutions -> /solutions/index.html directly (200,
    # no directory redirect to a trailing slash), keeping clean no-slash URLs that
    # match the canonical tags. Unknown paths fall back to the SPA shell.
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
